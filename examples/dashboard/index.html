<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Velo Vision | CPython vs Velo Benchmark</title>
    <link rel="stylesheet" href="style.css">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <div class="logo">
                <span class="bolt">⚡</span>
                <h1>VELO VISION</h1>
            </div>
            <p class="subtitle">CPython vs Velo Performance Comparison</p>
        </header>

        <main id="dashboard">
            <div class="loader">
                <div class="spinner"></div>
                <p>Loading Titanium Data...</p>
            </div>
        </main>

        <footer>
            <div class="legend">
                <span class="legend-item"><span class="dot cpython"></span> CPython (Legacy)</span>
                <span class="legend-item"><span class="dot velo"></span> Velo (Optimized)</span>
            </div>
            <p class="status">Velo Protocol v0.2.0 • [TITANIUM GRADE]</p>
        </footer>
    </div>
    <script src="app.js"></script>
</body>

</html>
