name: 'Setup Velo Environment'
description: 'Centralized environment setup for Velo CI including uv, python, and binary retrieval'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  download-binary:
    description: 'Whether to download the pre-built velo binary'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the artifact to download'
    required: false
    default: 'velo-binary-ubuntu'
  uv-version:
    description: 'UV version to use'
    required: false
    default: '0.5'

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install ${{ inputs.python-version }}

    - name: Create venv and install deps
      shell: bash
      run: |
        uv venv --python ${{ inputs.python-version }}
        uv sync --extra dev

    - name: Download Binary
      if: inputs.download-binary == 'true'
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: target/release/

    - name: Set permissions
      if: inputs.download-binary == 'true'
      shell: bash
      run: chmod +x target/release/velo
