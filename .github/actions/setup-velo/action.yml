name: 'Setup Velo Environment'
description: 'Centralized environment setup for Velo CI including uv, python, and binary retrieval'

inputs:
  python-version:
    description: 'Python version to use'
    required: false
    default: '3.11'
  download-binary:
    description: 'Whether to download the pre-built velo binary'
    required: false
    default: 'false'
  artifact-name:
    description: 'Name of the artifact to download (auto-detects OS if not specified)'
    required: false
    default: ''
  uv-version:
    description: 'UV version to use'
    required: false
    default: '0.5'

runs:
  using: "composite"
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        version: ${{ inputs.uv-version }}
        enable-cache: true

    - name: Set up Python ${{ inputs.python-version }}
      shell: bash
      run: |
        uv python install ${{ inputs.python-version }}
        uv python pin ${{ inputs.python-version }}
        # SSoT: Force uv to only use our managed Python version
        echo "UV_PYTHON_PREFERENCE=only-managed" >> "$GITHUB_ENV"
        # SSoT: Set UV_PYTHON from input parameter (not hardcoded)
        echo "UV_PYTHON=${{ inputs.python-version }}" >> "$GITHUB_ENV"

    - name: Create venv and install deps
      shell: bash
      run: |
        uv venv --python ${{ inputs.python-version }}
        uv sync
        # SSoT: Centralized pyo3 interpreter discovery
        echo "PYO3_PYTHON=$(pwd)/.venv/bin/python" >> $GITHUB_ENV
        # RFC-0019: Export LD_LIBRARY_PATH for native pyo3 workers
        # Note: uv-managed Python shared libraries are in the LIBDIR
        PYTHON_LIB_DIR=$(.venv/bin/python -c "import sysconfig; print(sysconfig.get_config_var('LIBDIR'))")
        # Try to find libpython in typical locations if sysconfig fails
        if [ ! -f "$PYTHON_LIB_DIR/libpython3.11.so.1.0" ]; then
           # Search in .venv
           VENV_LIB=$(find $(pwd)/.venv -name "libpython3.11.so.1.0" -print -quit | xargs dirname)
           if [ -n "$VENV_LIB" ]; then
             PYTHON_LIB_DIR="$VENV_LIB"
           fi
        fi
        echo "LD_LIBRARY_PATH=$PYTHON_LIB_DIR:$LD_LIBRARY_PATH" >> $GITHUB_ENV
        echo "Final LD_LIBRARY_PATH: $LD_LIBRARY_PATH"
        ls -l $PYTHON_LIB_DIR/libpython* || echo "libpython still not found in $PYTHON_LIB_DIR"

    - name: Determine artifact name
      if: inputs.download-binary == 'true'
      id: artifact
      shell: bash
      run: |
        if [ -n "${{ inputs.artifact-name }}" ]; then
          echo "name=${{ inputs.artifact-name }}" >> $GITHUB_OUTPUT
        elif [ "$RUNNER_OS" = "macOS" ]; then
          echo "name=velo-binary-macos" >> $GITHUB_OUTPUT
        else
          echo "name=velo-binary-ubuntu" >> $GITHUB_OUTPUT
        fi

    - name: Download Binary
      if: inputs.download-binary == 'true'
      uses: actions/download-artifact@v4
      with:
        name: ${{ steps.artifact.outputs.name }}
        path: target/release/

    - name: Set permissions
      if: inputs.download-binary == 'true'
      shell: bash
      run: chmod +x target/release/velo
