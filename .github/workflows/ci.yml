name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  # Lock versions for consistency between local and CI
  RUST_VERSION: "1.92.0"
  UV_VERSION: "0.5"

jobs:
  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      loader: ${{ steps.filter.outputs.loader }}
      zygote: ${{ steps.filter.outputs.zygote }}
      serve: ${{ steps.filter.outputs.serve }}
      analyze: ${{ steps.filter.outputs.analyze }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**/*.rs'
              - 'Cargo.*'
            loader:
              - 'src/loader/**/*.rs'
              - 'python/velo_loader.py'
              - 'tests/qa/test_phase5_loader.py'
              - 'tests/qa/phase5/**'
            zygote:
              - 'src/zygote/**/*.rs'
              - 'velo_zygote/**'
              - 'tests/qa/test_phase3_*.py'
            serve:
              - 'src/serve/**/*.rs'
              - 'tests/qa/test_phase3_5_*.py'
              - 'tests/qa/phase_6_1_1/**'
              - 'tests/security/**'
              - 'scripts/qa-fast.sh'
            analyze:
              - 'src/cmd/analyze.rs'
              - 'src/cmd/agent.rs'
              - 'tests/qa/test_phase4_*.py'
            workflow:
              - '.github/workflows/ci.yml'

  build:
    name: Build (Ubuntu / 3.11)
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}

      - name: Build
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: velo-binary-ubuntu
          path: target/release/velo
          if-no-files-found: error

      - name: Run tests
        run: uv run run_tests.py

      - name: Check binary size
        run: |
          echo "Binary size:"
          ls -lh target/release/velo

  build-matrix:
    name: Build Matrix (${{ matrix.os }} / ${{ matrix.python-version }})
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]
        exclude:
          - os: ubuntu-latest
            python-version: "3.11"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: uv run run_tests.py

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Run Clippy (Single Source of Truth)
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check

  # ============================================
  # QA Test Suite - Layered by Purpose
  # ============================================
  
  qa-zygote-core:
    name: "QA: Zygote Core E2E"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.zygote == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Test: E2E Real User Environment"
        run: uv run python -m pytest tests/qa/test_phase3_e2e_real_env.py -v --tb=short

  qa-zygote-security:
    name: "QA: Zygote Security Scan"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.zygote == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Test: IPC Security (path traversal, injection, DoS)"
        run: uv run python -m pytest tests/qa/test_phase3_security.py -v --tb=short

  qa-zygote-deployment:
    name: "QA: Zygote Deployment Scenarios"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.zygote == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Test: Deployment Structures (pip, brew, cargo install)"
        run: uv run python -m pytest tests/qa/test_phase3_deployment.py -v --tb=short

  qa-zygote-stress:
    name: "QA: Zygote Stress & Attack"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: (needs.changes.outputs.zygote == 'true' || needs.changes.outputs.workflow == 'true')
    # Allow failures - stress tests may be flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Test: Weird Environments (paths, permissions, signals)"
        run: uv run python -m pytest tests/qa/test_phase3_weird_env.py -v --tb=short
      
      - name: "Test: Brutal Attacks (resource exhaustion, DoS)"
        run: uv run python -m pytest tests/qa/test_phase3_brutal_attacks.py -v --tb=short

  # ============================================
  # Phase 3.5: Tiered QA Testing (velo serve)
  # ============================================

  qa-serve-smoke:
    name: "QA 3.5: Smoke (Tier 0)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Tier 0: Smoke Tests (~3s)"
        run: ./scripts/qa-fast.sh 0

  qa-serve-fast:
    name: "QA 3.5: Fast (Tier 1)"
    runs-on: ubuntu-latest
    needs: [qa-serve-smoke, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Tier 1: Fast Tests (~15s)"
        run: ./scripts/qa-fast.sh 1

  qa-serve-standard:
    name: "QA 3.5: Standard (Tier 2)"
    runs-on: ubuntu-latest
    needs: [qa-serve-fast, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Tier 2: Standard Tests (~7min)"
        run: ./scripts/qa-fast.sh 2

  qa-serve-heavy:
    name: "QA 3.5: Heavy (Tier 3)"
    runs-on: ubuntu-latest
    needs: [qa-serve-standard, changes]
    # Only run on main branch - heavy tests are optional
    if: github.ref == 'refs/heads/main' && (needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true')
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Tier 3: Heavy/Brutal Tests (~5min)"
        run: ./scripts/qa-fast.sh 3

  # ============================================
  # Phase 5.0: Fast Loader QA (velo run --fast)
  # ============================================

  qa-fast-loader-smoke:
    name: "QA 5.0: Smoke (L0)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.loader == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "L0: Smoke Tests (~3s)"
        run: uv run pytest tests/qa/phase5/test_l0_smoke.py -v --tb=short -m smoke

  qa-fast-loader-standard:
    name: "QA 5.0: Standard (L1-L3)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-smoke, changes]
    if: needs.changes.outputs.loader == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "L1-L3: Happy Path + Sad Path + Config (~30s)"
        run: |
          uv run pytest tests/qa/test_phase5_loader.py \
            tests/qa/phase5/test_l1_happy_path.py \
            tests/qa/phase5/test_l2_sad_path.py \
            tests/qa/phase5/test_l3_config.py \
            tests/qa/phase5/test_python_loader.py \
            tests/qa/phase5/test_cli_bundle.py \
            -v --tb=short

  qa-fast-loader-security:
    name: "QA 5.0: Security (L4)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-standard, changes]
    if: needs.changes.outputs.loader == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "L4: Security Tests (RFC-0006 §3)"
        run: uv run pytest tests/qa/phase5/test_l4_security.py -v --tb=short -m security

  qa-fast-loader-chaos:
    name: "QA 5.0: Chaos (L5)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-security, changes]
    if: (needs.changes.outputs.loader == 'true' || needs.changes.outputs.workflow == 'true')
    continue-on-error: true  # L5 chaos tests may be flaky
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "L5: Chaos/Edge Tests (stress testing)"
        run: uv run pytest tests/qa/phase5/test_l5_chaos.py -v --tb=short -m edge

  # ============================================
  # Phase 6.1: Serve & Analyze Hardened QA
  # RFC-0010 Security & Stability Verification
  # ============================================

  qa-phase61-security-hardened:
    name: "QA 6.1: Security Hardened (RFC-0010)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Security: Command Injection, Path Traversal, Env Sanitization"
        run: uv run pytest tests/qa/test_phase6_1_security_hardened.py -v --tb=short

  qa-phase61-stability-hardened:
    name: "QA 6.1: Stability Hardened (RAII, Signals)"
    runs-on: ubuntu-latest
    needs: [qa-phase61-security-hardened, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Stability: RAII Cleanup, Signal Forwarding, Debouncer"
        run: uv run pytest tests/qa/test_phase6_1_stability_hardened.py -v --tb=short

  qa-phase61-dx-performance:
    name: "QA 6.1: DX & Performance"
    runs-on: ubuntu-latest
    needs: [qa-phase61-stability-hardened, changes]
    if: (needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true')
    continue-on-error: true  # Performance tests may be flaky
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "DX: Error Messages, Typo Hints, Framework Detection"
        run: uv run pytest tests/qa/test_phase6_1_dx_hardened.py -v --tb=short
      
      - name: "Performance: Latency, Memory, File Descriptors"
        run: uv run pytest tests/qa/test_phase6_1_performance_hardened.py -v --tb=short

  qa-phase62-prosecutor:
    name: "QA 6.2: Prosecutor Suite (RFC-0012)"
    runs-on: ubuntu-latest
    needs: [qa-phase61-security-hardened, changes]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Prosecutor: Collision (Sin 3) & Hygiene (Sin 1)"
        # Note: Prosecutor Suite includes ArchGuard to auto-adapt to runner arch
        run: uv run pytest tests/qa/phase_6_1_1/test_sin_of_collision.py tests/qa/phase_6_1_1/test_sec_shield.py -v --tb=short

  qa-phase611-core:
    name: "QA 6.1.1: Core Integration"
    runs-on: ubuntu-latest
    needs: [qa-phase62-prosecutor]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      - name: "Run Core Tests"
        run: |
          uv run pytest \
            tests/qa/phase_6_1_1/test_phase611_smoke.py \
            tests/qa/phase_6_1_1/test_phase611_golden_path.py \
            tests/qa/phase_6_1_1/test_phase611_features.py \
            tests/qa/phase_6_1_1/test_phase611_integration.py \
            tests/qa/phase_6_1_1/test_isolation.py \
            -v --tb=short

  qa-phase611-agents:
    name: "QA 6.1.1: Multi-Agent Simulation"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      - name: "Run Agent Tests (A/B/C/D)"
        run: |
          uv run pytest \
            tests/qa/phase_6_1_1/test_phase611_agent_*.py \
            -v --tb=short

  qa-phase611-specialized:
    name: "QA 6.1.1: Specialized & Expert"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      - name: "Run Expert/Blocker/Whitebox Tests"
        run: |
          uv run pytest \
            tests/qa/phase_6_1_1/test_phase611_expert_concerns.py \
            tests/qa/phase_6_1_1/test_phase611_release_blockers.py \
            tests/qa/phase_6_1_1/test_phase611_whitebox.py \
            tests/qa/phase_6_1_1/test_security_hardened.py \
            -v --tb=short

  qa-phase611-perf:
    name: "QA 6.1.1: Performance Baselines"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core]
    if: needs.changes.outputs.serve == 'true' || needs.changes.outputs.workflow == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      - name: "Run Performance Tests"
        run: |
          uv run pytest \
            tests/qa/phase_6_1_1/test_phase611_perf_regressions.py \
            tests/qa/phase_6_1_1/test_shadow_preload_benchmark.py \
            -v --tb=short

  # ============================================
  # Phase 4.0: velo analyze QA
  # ============================================

  qa-analyze-core:
    name: "QA 4.0: Analyze Core"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: needs.changes.outputs.analyze == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Phase 4.0: Core + Agent Tests"
        run: |
          chmod +x .venv/bin/python3
          uv run pytest tests/qa/test_phase4_analyze.py tests/qa/test_phase4_agent_*.py -v --tb=short

  qa-analyze-integration:
    name: "QA 4.0: Integration (SLOW)"
    runs-on: ubuntu-latest
    needs: [qa-analyze-core, changes]
    if: needs.changes.outputs.analyze == 'true' || needs.changes.outputs.workflow == 'true'
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Phase 4.0: Integration Tests (Real Projects)"
        run: |
          chmod +x .venv/bin/python3
          uv run pytest tests/qa/test_phase4_integration.py -v --tb=short

  qa-benchmark:
    name: "QA: Benchmark"
    runs-on: ubuntu-latest
    needs: [qa-analyze-integration, changes]
    if: (needs.changes.outputs.analyze == 'true' || needs.changes.outputs.workflow == 'true')
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
      
      - name: "Benchmark: Performance Validation"
        run: |
          chmod +x .venv/bin/python3
          uv run python benchmark_projects.py --all

  coverage:
    name: Code Coverage
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      
      - name: Check coverage threshold (70%)
        run: cargo llvm-cov report --fail-under-lines 70
        continue-on-error: true  # Warning only for now
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
