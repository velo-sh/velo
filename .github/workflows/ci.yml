name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 21 * * *'  # Run nightly at 5 AM CST (21:00 UTC)

# Concurrency: Only cancel code CI runs, not docs
concurrency:
  group: code-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_BUILD_JOBS: 2
  UV_CONCURRENT_INSTALLS: 1
  PYTEST_XDIST_WORKERS: 1
  PYTHONPATH: python
  VELO_ZYGOTE_MAX_POOL_SIZE: 8
  VELO_ZYGOTE_POOL_SIZE: 2
  VELO_TEST_MODE: "1"
  VELO_NO_PREWARM: "1"
  UV_VERSION: "0.9" # Centralized uv version
  VELO_ENV: ci # RFC-0012: CI environment profile (disables strict_optimizations)
  # RFC-0012: Resilience Overrides for CI (TIERED CONFIG)
  VELO_ZYGOTE_SOCKET_TIMEOUT: 60
  VELO_ZYGOTE_WORKER_TIMEOUT: 60
  VELO_MAX_BUNDLE_SIZE: 50
  # Test timeout multiplier (CI is slower than local)
  VELO_TIMEOUT_MULTIPLIER: 6
  # Note: UV_PYTHON is now set dynamically in setup-velo action from SSOT config
  # Worker respawn: fail_fast_limit is auto-scaled by TIMEOUT_MULTIPLIER (5*6=30 in CI)
jobs:
  performance-canary:
    name: 🐤 Performance Canary (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      VELO_TIMEOUT_MULTIPLIER: 1.0  # STRICT: Must pass with 1x timeout
    steps:
      - uses: actions/checkout@v4
      
      # SSOT: Read Python version from centralized config (this job doesn't depend on changes)
      - name: Read SSOT Config
        id: config
        run: |
          PYTHON_VERSION=$(grep '^python_version' config/constants.toml | cut -d'"' -f2)
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "SSOT Python version: $PYTHON_VERSION"
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: ${{ steps.config.outputs.python_version }}
          uv-version: ${{ env.UV_VERSION }}
      - name: Pre-Flight Diagnostic
        run: cargo run --release --all-features -- debug pre-flight
      - name: Build Velo (Release)
        run: cargo build --release --all-features
      - name: Run Total War Suite (Strict)
        run: |
          # Use the environment prepared by setup-velo
          uv run pytest tests/qa


  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      loader: ${{ steps.filter.outputs.loader }}
      zygote: ${{ steps.filter.outputs.zygote }}
      serve: ${{ steps.filter.outputs.serve }}
      analyze: ${{ steps.filter.outputs.analyze }}
      workflow: ${{ steps.filter.outputs.workflow }}
      qa_infra: ${{ steps.filter.outputs.qa_infra }}
      kinetic: ${{ steps.filter.outputs.kinetic }}
      # SSOT: Python version from config/constants.toml
      python_version: ${{ steps.config.outputs.python_version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      # SSOT: Read Python version from centralized config
      - name: Read SSOT Config
        id: config
        run: |
          PYTHON_VERSION=$(grep '^python_version' config/constants.toml | cut -d'"' -f2)
          echo "python_version=$PYTHON_VERSION" >> "$GITHUB_OUTPUT"
          echo "SSOT Python version: $PYTHON_VERSION"

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'crates/**/*.rs'
              - 'tests/**/*.rs'
              - 'tests/qa/**/*.py'
              - 'Cargo.*'
              - 'config/**'
              - 'crates/velo_macros/**/*.rs'
            loader:
              - 'crates/velo-cli/src/cmd/loader.rs'
              - 'python/velo_loader.py'
              - 'tests/qa/test_phase5_loader.py'
              - 'tests/qa/phase5/**'
              - 'tests/qa/phase5_1/**'
              - 'tests/qa/phase5_2/**'
            zygote:
              - 'crates/velo-core/src/zygote/**/*.rs'
              - 'python/velo_zygote/**'
              - 'tests/qa/test_phase3_*.py'
              - 'tests/qa/test_phase3_zygote_lifecycle.py'
              - 'tests/qa/test_phase3_harness.py'
              - 'tests/qa/test_preflight.py'
            serve:
              - 'crates/velo-serve/src/**/*.rs'
              - 'tests/qa/test_phase3_5_*.py'
              - 'tests/qa/heavy/**'
              - 'tests/qa/test_phase6_1_*.py'
              - 'tests/security/**'
              - 'tests/qa/test_phase6_1_*.py'
              - 'tests/qa/test_e2e_serve.py'
              - 'scripts/qa-fast.sh'
            analyze:
              - 'crates/velo-cli/src/cmd/analyze.rs'
              - 'crates/velo-cli/src/cmd/agent.rs'
              - 'tests/qa/test_phase4_*.py'
            kinetic:
              - 'crates/velo-core/src/zygote/**/*.rs'
              - 'python/velo_zygote/**'
              - 'crates/velo-serve/src/**/*.rs'
              - 'tests/qa/test_phase6_2_*.py'
            workflow:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-velo/**'
              - 'Dockerfile.*'
              - 'scripts/**'
            qa_infra:
              - 'tests/qa/conftest.py'
              - 'tests/qa/utils/**'
              - 'tests/qa/conftest_markers.py'
              - 'scripts/dev/run_tests.py'

  build:
    name: Build
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.analyze == 'true' ||
      needs.changes.outputs.qa_infra == 'true' ||
      needs.changes.outputs.kinetic == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Create Workspace TMPDIR
        run: mkdir -p pytest_tmp

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: "velo-build-v2"
          cache-on-failure: true

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Sync Python deps
        run: uv sync --python 3.11

      - name: Set PYO3_PYTHON for Rust build
        run: echo "PYO3_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Build Release
        run: cargo build --release --all-features

      - name: "RFC-0020: Pre-Flight Check"
        run: ./target/release/velo debug pre-flight && ./target/release/velo debug zygote --json

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: velo-binary-ubuntu
          path: target/release/velo
          if-no-files-found: error

      - name: Run Python tests
        run: uv run scripts/dev/run_tests.py

      - name: Check binary size
        run: |
          echo "Binary size:"
          ls -lh target/release/velo

  # Parallel Rust Test Matrix - RFC-0033: Leverage workspace independence
  rust-tests-matrix:
    name: "Rust Tests: ${{ matrix.crate }}"
    needs: [build, changes]
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        crate:
          - velo-protocol
          - velo-graph
          - velo-core
          - velo-serve
          - velo
          - velo-test
    steps:
      - uses: actions/checkout@v4
      - name: Create Workspace TMPDIR
        run: mkdir -p pytest_tmp
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "velo-test-${{ matrix.crate }}"
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Sync Python deps
        run: uv sync --python 3.11
      - name: Set PYO3_PYTHON for Rust build
        run: echo "PYO3_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"
      - name: "Test: ${{ matrix.crate }}"
        # SSOT: Use ci-runner.sh for consistent behavior with local/Docker CI
        run: ./scripts/ci-runner.sh test-crate ${{ matrix.crate }}

  # NOTE: macOS build removed - developers run locally on Mac, CI focuses on Linux only
  # See: First-Principles SSOT Python Version Fix walkthrough

  # Parallel Clippy Matrix - RFC-0033: Leverage workspace independence
  clippy-matrix:
    name: "Clippy: ${{ matrix.crate }}"
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        crate:
          - velo-protocol
          - velo-graph
          - velo-core
          - velo-serve
          - velo
          - velo-test
    steps:
      - uses: actions/checkout@v4
      - name: Create Workspace TMPDIR
        run: mkdir -p pytest_tmp
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "velo-clippy-${{ matrix.crate }}"
          cache-on-failure: true
      - uses: astral-sh/setup-uv@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: uv sync --python 3.11
      - name: Set PYO3_PYTHON for Rust build
        run: echo "PYO3_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"
      - name: "Clippy: ${{ matrix.crate }}"
        # SSOT: Use ci-runner.sh for consistent behavior with local/Docker CI
        run: ./scripts/ci-runner.sh clippy-crate ${{ matrix.crate }}

  python-tests:
    name: Python Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create Workspace TMPDIR
        run: mkdir -p pytest_tmp
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - name: Set up Python
        run: uv python install 3.11
      - name: Install dependencies
        run: uv sync --dev
      - name: Run Pytest
        run: PYTHONPATH=python uv run pytest tests/unit

  bench-check:
    name: Zygote Startup Benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
      - name: Build Velo
        run: cargo build -p velo
      - name: Run Startup Benchmark
        run: |
          ./target/debug/velo zygote start &
          # Simple check for startup speed (should be < 2s in CI)
          timeout 2s sh -c 'until ./target/debug/velo zygote status; do sleep 0.1; done'
          ./target/debug/velo zygote stop

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      # SSOT: Use ci-runner.sh for consistent behavior
      - name: Check Format
        run: ./scripts/ci-runner.sh fmt-check

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: "velo-audit"
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      # SSOT: Use ci-runner.sh for consistent behavior
      - name: Run Security Audit
        run: ./scripts/ci-runner.sh audit

  mypy:
    name: Mypy (Python Type Check)
    needs: changes
    if: needs.changes.outputs.zygote == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: ${{ needs.changes.outputs.python_version }}
          uv-version: ${{ env.UV_VERSION }}
      # constants.py is now committed to git (generated from config/constants.toml)
      - name: Verify constants.py sync
        run: uv run python scripts/sync-constants.py --check
      - name: Run Mypy via Pre-Commit (SSOT)
        run: uv run pre-commit run mypy --all-files

  ruff:
    name: Ruff (Python Lint)
    needs: changes
    if: needs.changes.outputs.zygote == 'true' || needs.changes.outputs.qa_infra == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: ${{ needs.changes.outputs.python_version }}
          uv-version: ${{ env.UV_VERSION }}
      # SSOT: Use ci-runner.sh for consistent behavior with local/Docker CI
      - name: Run Ruff (lint + format check)
        run: ./scripts/ci-runner.sh ruff-check

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint

  # ============================================
  # QA Test Suite - Layered by Purpose
  # ============================================
  
  # Phase 7.x: Split into separate jobs for GitHub Actions visibility
  qa-phase-7-0:
    name: "QA 7.0: Memory Gravity (RFC-0015)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_v3_zero_config_architecture.py -v --tb=short

  qa-phase-7-1:
    name: "QA 7.1: Custody & Forensics"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_v3_user_journey_e2e.py -v --tb=short

  qa-phase-7-2:
    name: "QA 7.2: ASGI Bridge Compatibility (${{ matrix.shard }})"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_v3_user_scenarios.py -v --tb=short --shard-id ${{ matrix.shard }} --num-shards 2


  qa-zygote-matrix:
    name: "QA: Zygote ${{ matrix.suite_name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, changes]
    if: |
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "E2E Real Env", path: "tests/qa/test_phase3_e2e_real_env.py" }
          - { name: "Security", path: "tests/qa/test_phase3_security.py" }
          - { name: "Deployment", path: "tests/qa/test_phase3_deployment.py" }
          - { name: "Weird Env", path: "tests/qa/test_phase3_weird_env.py" }
          - { name: "Brutal Attacks", path: "tests/qa/test_phase3_brutal_attacks.py" }
        include:
          - suite: { name: "E2E Real Env" }
            suite_name: "E2E Real Env"
          - suite: { name: "Security" }
            suite_name: "Security"
          - suite: { name: "Deployment" }
            suite_name: "Deployment"
          - suite: { name: "Weird Env" }
            suite_name: "Weird Env"
          - suite: { name: "Brutal Attacks" }
            suite_name: "Brutal Attacks"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: PYTHONPATH=python uv run pytest ${{ matrix.suite.path }} -n ${PYTEST_XDIST_WORKERS:-1} --dist loadscope -v --tb=short


  # ============================================
  # Phase 3.5: Tiered QA Testing (velo serve)
  # ============================================

  qa-serve-matrix:
    name: "QA 3.5: Serve Tier ${{ matrix.tier }}"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        tier: [0, 1, 2]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh ${{ matrix.tier }}


  qa-serve-heavy:
    name: "QA 3.5: Heavy (Tier 3)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]  # Changed from qa-serve-smoke to build
    # Only run on main branch - heavy tests are optional
    if: |
      github.ref == 'refs/heads/main' && (
        needs.changes.outputs.serve == 'true' || 
        needs.changes.outputs.rust == 'true' || 
        needs.changes.outputs.workflow == 'true' || 
        needs.changes.outputs.qa_infra == 'true'
      )
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh 3

  # ============================================
  # Phase 5.0: Fast Loader QA (velo run --fast)
  # ============================================

  qa-fast-loader-matrix:
    name: "QA 5.0: Fast Loader ${{ matrix.suite_name }}"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        suite:
          - { name: "Smoke & Happy", path: "tests/qa/heavy/stability/test_l0_smoke.py tests/qa/test_phase5_loader.py tests/qa/heavy/stability/test_l1_happy_path.py" }
          - { name: "Sad & Config", path: "tests/qa/heavy/chaos/test_l2_sad_path.py tests/qa/heavy/stability/test_l3_config.py" }
          - { name: "Security & Chaos", path: "tests/qa/heavy/chaos/test_l4_security.py tests/qa/heavy/chaos/test_l5_chaos.py" }
          - { name: "CLI & Utils", path: "tests/qa/heavy/stability/test_cli_bundle.py tests/qa/heavy/chaos/test_python_loader.py" }
        include:
          - suite: { name: "Smoke & Happy" }
            suite_name: "Smoke & Happy"
          - suite: { name: "Sad & Config" }
            suite_name: "Sad & Config"
          - suite: { name: "Security & Chaos" }
            suite_name: "Security & Chaos"
          - suite: { name: "CLI & Utils" }
            suite_name: "CLI & Utils"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: PYTHONPATH=python uv run pytest ${{ matrix.suite.path }} -n ${PYTEST_XDIST_WORKERS:-1} --dist loadscope -v --tb=short


  # ============================================
  # Phase 6.1: Serve & Analyze Hardened QA
  # RFC-0010 Security & Stability Verification
  # ============================================

  qa-phase61-security-hardened:
    name: "QA 6.1: Security Hardened (RFC-0010)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_phase6_1_security_hardened.py -v --tb=short

  qa-phase61-stability-hardened:
    name: "QA 6.1: Stability Hardened (RAII, Signals)"
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_phase6_1_stability_hardened.py -v --tb=short --shard-id ${{ matrix.shard }} --num-shards 2

  qa-phase61-dx:
    name: "QA 6.1: DX (RFC-0010)"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_phase6_1_dx_hardened.py -v --tb=short

  qa-phase61-performance:
    name: "QA 6.1: Performance"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
