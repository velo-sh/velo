name: CI

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - 'CHANGELOG.md'
      - 'LICENSE'
      - '.gitignore'
  pull_request:
    branches: ['**']
  schedule:
    - cron: '0 21 * * *'  # Run nightly at 5 AM CST (21:00 UTC)

# Concurrency: Only cancel code CI runs, not docs
concurrency:
  group: code-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  UV_VERSION: "0.9" # Centralized uv version
  VELO_ENV: ci # RFC-0012: CI environment profile (disables strict_optimizations)
  # RFC-0012: Resilience Overrides for CI (TIERED CONFIG)
  VELO_ZYGOTE_SOCKET_TIMEOUT: 60
  VELO_ZYGOTE_WORKER_TIMEOUT: 60
  VELO_MAX_BUNDLE_SIZE: 50
  # Test timeout multiplier (CI is slower than local)
  VELO_TIMEOUT_MULTIPLIER: 6
  # SSoT: Force all uv operations to use 3.11 to prevent version drift (e.g., matching >=3.11 with 3.12)
  UV_PYTHON: "3.11"
  # Worker respawn: fail_fast_limit is auto-scaled by TIMEOUT_MULTIPLIER (5*6=30 in CI)
jobs:
  performance-canary:
    name: 🐤 Performance Canary (Nightly)
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      VELO_TIMEOUT_MULTIPLIER: 1.0  # STRICT: Must pass with 1x timeout
    steps:
      - uses: actions/checkout@v4
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}
      - name: Pre-Flight Diagnostic
        run: cargo run --release -- debug pre-flight
      - name: Build Velo (Release)
        run: cargo build --release
      - name: Run Total War Suite (Strict)
        run: |
          # Use the environment prepared by setup-velo
          uv run pytest tests/qa


  changes:
    name: Check for Changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      loader: ${{ steps.filter.outputs.loader }}
      zygote: ${{ steps.filter.outputs.zygote }}
      serve: ${{ steps.filter.outputs.serve }}
      analyze: ${{ steps.filter.outputs.analyze }}
      workflow: ${{ steps.filter.outputs.workflow }}
      qa_infra: ${{ steps.filter.outputs.qa_infra }}
      kinetic: ${{ steps.filter.outputs.kinetic }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'src/**/*.rs'
              - 'tests/**/*.rs'
              - 'tests/qa/**/*.py'
              - 'Cargo.*'
              - 'build.rs'
              - 'config/**'
            loader:
              - 'src/loader/**/*.rs'
              - 'python/velo_loader.py'
              - 'tests/qa/test_phase5_loader.py'
              - 'tests/qa/phase5/**'
              - 'tests/qa/phase5_1/**'
              - 'tests/qa/phase5_2/**'
            zygote:
              - 'src/zygote/**/*.rs'
              - 'velo_zygote/**'
              - 'tests/qa/test_phase3_*.py'
              - 'tests/qa/test_phase3_zygote_lifecycle.py'
              - 'tests/qa/test_phase3_harness.py'
              - 'tests/qa/test_preflight.py'
            serve:
              - 'src/serve/**/*.rs'
              - 'tests/qa/test_phase3_5_*.py'
              - 'tests/qa/phase_6_1_1/**'
              - 'tests/qa/phase6_1/**'
              - 'tests/security/**'
              - 'tests/qa/test_phase6_1_*.py'
              - 'tests/qa/test_e2e_serve.py'
              - 'scripts/qa-fast.sh'
            analyze:
              - 'src/cmd/analyze.rs'
              - 'src/cmd/agent.rs'
              - 'tests/qa/test_phase4_*.py'
            kinetic:
              - 'src/zygote/**/*.rs'
              - 'velo_zygote/**'
              - 'src/serve/**/*.rs'
              - 'tests/qa/test_phase6_2_*.py'
            workflow:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-velo/**'
              - 'Dockerfile.*'
              - 'scripts/**'
            qa_infra:
              - 'tests/qa/conftest.py'
              - 'tests/qa/utils/**'
              - 'tests/qa/conftest_markers.py'
              - 'run_tests.py'

  build:
    name: Build (Ubuntu / 3.11)
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.analyze == 'true' ||
      needs.changes.outputs.qa_infra == 'true' ||
      needs.changes.outputs.kinetic == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify Rust Toolchain
        run: rustup show

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}

      - name: Pre-Flight Diagnostic
        run: cargo run --release -- debug pre-flight

      - name: Build
        run: cargo build --release

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: velo-binary-ubuntu
          path: target/release/velo
          if-no-files-found: error

      - name: Run Rust tests
        run: cargo test

      - name: Run Python tests
        run: uv run run_tests.py

      - name: "RFC-0020: Pre-Flight Check"
        run: ./target/release/velo debug zygote --json

      - name: Check binary size
        run: |
          echo "Binary size:"
          ls -lh target/release/velo

  build-matrix:
    name: Build Matrix (${{ matrix.os }} / ${{ matrix.python-version }})
    needs: changes
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.analyze == 'true' ||
      needs.changes.outputs.qa_infra == 'true' ||
      needs.changes.outputs.kinetic == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest]
        python-version: ["3.11"]
    steps:
      - uses: actions/checkout@v4

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          # SSoT: Include Python version in cache key to invalidate when Python changes
          # This prevents stale PyO3 linkage artifacts from being restored
          prefix-key: "v1-py${{ matrix.python-version }}"

      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: ${{ matrix.python-version }}
          uv-version: ${{ env.UV_VERSION }}

      - name: Verify Python Environment (Debug)
        run: |
          echo "Python version: $(python3 --version)"
          echo "UV Python: $UV_PYTHON"
          echo "UV_PYTHON_PREFERENCE: $UV_PYTHON_PREFERENCE"
          echo "PYO3_PYTHON: $PYO3_PYTHON"
          uv python list
          ls -la .python-version || echo "No .python-version file"
          # SSoT: Explicitly re-enforce PYO3_PYTHON just in case
          echo "PYO3_PYTHON=$(pwd)/.venv/bin/python" >> "$GITHUB_ENV"

      - name: Pre-Flight Diagnostic
        run: cargo run --release -- debug pre-flight

      - name: Build
        run: cargo build --release

      # Upload macOS binary for Kinetic Regression Gate
      - name: Upload macOS Binary
        if: matrix.os == 'macos-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: velo-binary-macos
          path: target/release/velo
          if-no-files-found: error

      - name: Run Rust tests
        run: cargo test

      - name: Run Python tests
        run: uv run run_tests.py

  clippy:
    name: Clippy
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust Toolchain
        run: rustup show
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}
      - name: Pre-Flight Diagnostic
        run: cargo run --all-features -- debug pre-flight
      - name: Run Clippy (Single Source of Truth)
        run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Rust Toolchain
        run: rustup show
      - name: Rust Cache
        uses: swatinem/rust-cache@v2
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}
      - run: cargo fmt --all -- --check

  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install actionlint
        run: |
          bash <(curl https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          echo "$PWD" >> "$GITHUB_PATH"
      - name: Run actionlint
        run: actionlint

  # ============================================
  # QA Test Suite - Layered by Purpose
  # ============================================
  
  qa-zygote-core:
    name: "QA: Zygote Core E2E"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run python -m pytest tests/qa/test_phase3_e2e_real_env.py -v --tb=short

  qa-zygote-security:
    name: "QA: Zygote Security Scan"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run python -m pytest tests/qa/test_phase3_security.py -v --tb=short

  qa-zygote-deployment:
    name: "QA: Zygote Deployment Scenarios"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run python -m pytest tests/qa/test_phase3_deployment.py -v --tb=short

  qa-zygote-stress:
    name: "QA: Zygote Stress & Attack"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.zygote == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    # Allow failures - stress tests may be flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run python -m pytest tests/qa/test_phase3_weird_env.py -v --tb=short
             uv run python -m pytest tests/qa/test_phase3_brutal_attacks.py -v --tb=short

  # ============================================
  # Phase 3.5: Tiered QA Testing (velo serve)
  # ============================================

  qa-serve-smoke:
    name: "QA 3.5: Smoke (Tier 0)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh 0

  qa-serve-fast:
    name: "QA 3.5: Fast (Tier 1)"
    runs-on: ubuntu-latest
    needs: [qa-serve-smoke, changes]  # Only depend on smoke, not other tiers
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh 1

  qa-serve-standard:
    name: "QA 3.5: Standard (Tier 2)"
    runs-on: ubuntu-latest
    needs: [qa-serve-smoke, changes]  # PARALLEL: Depend only on smoke, not on fast
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh 2

  qa-serve-heavy:
    name: "QA 3.5: Heavy (Tier 3)"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [qa-serve-smoke, changes]  # PARALLEL: Depend only on smoke
    # Only run on main branch - heavy tests are optional
    if: |
      github.ref == 'refs/heads/main' && (
        needs.changes.outputs.serve == 'true' || 
        needs.changes.outputs.rust == 'true' || 
        needs.changes.outputs.workflow == 'true' || 
        needs.changes.outputs.qa_infra == 'true'
      )
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: ./scripts/qa-fast.sh 3

  # ============================================
  # Phase 5.0: Fast Loader QA (velo run --fast)
  # ============================================

  qa-fast-loader-smoke:
    name: "QA 5.0: Smoke (L0)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/phase5/test_l0_smoke.py -v --tb=short -m smoke

  qa-fast-loader-standard:
    name: "QA 5.0: Standard (L1-L3)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-smoke, changes]  # PARALLEL: Depend only on smoke
    if: |
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest tests/qa/test_phase5_loader.py \
             tests/qa/phase5/test_l1_happy_path.py \
             tests/qa/phase5/test_l2_sad_path.py \
             tests/qa/phase5/test_l3_config.py \
             tests/qa/phase5/test_python_loader.py \
             tests/qa/phase5/test_cli_bundle.py \
             -v --tb=short

  qa-fast-loader-security:
    name: "QA 5.0: Security (L4)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-smoke, changes]  # PARALLEL: Depend only on smoke
    if: |
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/phase5/test_l4_security.py -v --tb=short -m security

  qa-fast-loader-chaos:
    name: "QA 5.0: Chaos (L5)"
    runs-on: ubuntu-latest
    needs: [qa-fast-loader-smoke, changes]  # PARALLEL: Depend only on smoke
    if: |
      needs.changes.outputs.loader == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    continue-on-error: true  # L5 chaos tests may be flaky
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/phase5/test_l5_chaos.py -v --tb=short -m edge

  # ============================================
  # Phase 6.1: Serve & Analyze Hardened QA
  # RFC-0010 Security & Stability Verification
  # ============================================

  qa-phase61-security-hardened:
    name: "QA 6.1: Security Hardened (RFC-0010)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_phase6_1_security_hardened.py -v --tb=short

  qa-phase61-stability-hardened:
    name: "QA 6.1: Stability Hardened (RAII, Signals)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/test_phase6_1_stability_hardened.py -v --tb=short

  qa-phase61-dx-performance:
    name: "QA 6.1: DX & Performance"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    continue-on-error: true  # Performance tests may be flaky
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest tests/qa/test_phase6_1_dx_hardened.py -v --tb=short
             uv run pytest tests/qa/test_phase6_1_performance_hardened.py -v --tb=short

  qa-phase62-prosecutor:
    name: "QA 6.2: Prosecutor Suite (RFC-0012)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          # Note: Prosecutor Suite includes ArchGuard to auto-adapt to runner arch
          command: uv run pytest tests/qa/phase_6_1_1/test_sin_of_collision.py tests/qa/phase_6_1_1/test_sec_shield.py -v --tb=short

  qa-phase611-core:
    name: "QA 6.1.1: Core Integration"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest \
               tests/qa/phase_6_1_1/test_phase611_smoke.py \
               tests/qa/phase_6_1_1/test_phase611_golden_path.py \
               tests/qa/phase_6_1_1/test_phase611_features.py \
               tests/qa/phase_6_1_1/test_phase611_integration.py \
               tests/qa/phase_6_1_1/test_isolation.py \
               -v --tb=short

  qa-phase611-agents:
    name: "QA 6.1.1: Multi-Agent Simulation"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest \
               tests/qa/phase_6_1_1/test_phase611_agent_*.py \
               -v --tb=short

  qa-phase611-specialized:
    name: "QA 6.1.1: Specialized & Expert"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest \
               tests/qa/phase_6_1_1/test_phase611_expert_concerns.py \
               tests/qa/phase_6_1_1/test_phase611_release_blockers.py \
               tests/qa/phase_6_1_1/test_phase611_whitebox.py \
               tests/qa/phase_6_1_1/test_security_hardened.py \
               -v --tb=short

  qa-phase611-perf:
    name: "QA 6.1.1: Performance Baselines"
    runs-on: ubuntu-latest
    needs: [qa-phase611-core, changes]
    if: |
      needs.changes.outputs.serve == 'true' || 
      needs.changes.outputs.zygote == 'true' ||
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             uv run pytest \
               tests/qa/phase_6_1_1/test_phase611_perf_regressions.py \
               tests/qa/phase_6_1_1/test_shadow_preload_benchmark.py \
               -v --tb=short

  # ============================================
  # Phase 7.0: Memory Gravity (RFC-0015)
  # ============================================

  qa-phase7-0-memory:
    name: "QA 7.0: Memory Gravity (RFC-0015)"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: uv run pytest tests/qa/phase_7_0 -v --tb=short



  qa-kinetic-regression-gate:
    name: "QA 6.2: Kinetic Regression Gate"
    runs-on: ${{ matrix.os }}
    needs: [build, build-matrix, changes]
    if: |
      needs.changes.outputs.kinetic == 'true' || 
      needs.changes.outputs.workflow == 'true' ||
      needs.changes.outputs.rust == 'true' ||
      needs.changes.outputs.qa_infra == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          download-binary: true
          uv-version: ${{ env.UV_VERSION }}
          
      - name: "Verification: Agent D CHAOS Suite (Detection Probe)"
        run: |
          # Use downloaded binary to ensure path alignment
          PATH="$(pwd)/target/debug:$(pwd)/target/release:$PATH"
          export PATH
          uv run pytest tests/qa/test_phase6_2_agent_d_destroyer.py -v --tb=short

      - name: "Verification: Dry-Run Hang Probe"
        run: |
          PATH="$(pwd)/target/debug:$(pwd)/target/release:$PATH"
          export PATH
          # Detect the specific regression we just fixed: dry-run hanging in Zygote mode
          # Note: Zygote is enabled by default, no --use-zygote flag exists (only --no-zygote)
          echo "from fastapi import FastAPI; app = FastAPI()" > main.py
          uv pip install fastapi
          # Python timeout script for cross-platform support (Mac/Linux)
          cat <<EOF > timeout_run.py
          import sys, subprocess, time
          try:
              # Run command with timeout
              subprocess.run(sys.argv[2:], timeout=float(sys.argv[1]), check=True)
          except subprocess.TimeoutExpired:
              sys.exit(124)
          except subprocess.CalledProcessError as e:
              sys.exit(e.returncode)
          EOF
          
          python timeout_run.py 30 velo serve main:app --dry-run || {
            RET=$?
            if [ $RET -eq 124 ]; then
              echo "❌ CRITICAL REGRESSION: velo serve --dry-run hung (Zygote deadlock)!"
              exit 1
            elif [ $RET -ne 0 ]; then
              echo "❌ CRITICAL FAILURE: velo serve failed with exit code $RET"
              exit 1
            fi
          }

  # ============================================
  # Phase 4.0: velo analyze QA
  # ============================================

  qa-analyze-core:
    name: "QA 4.0: Analyze Core"
    runs-on: ubuntu-latest
    needs: [build, changes]
    if: |
      needs.changes.outputs.analyze == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
            chmod +x .venv/bin/python3
            uv run pytest tests/qa/test_phase4_analyze.py tests/qa/test_phase4_agent_*.py -v --tb=short

  qa-analyze-integration:
    name: "QA 4.0: Integration (SLOW)"
    runs-on: ubuntu-latest
    needs: [qa-analyze-core, changes]
    if: |
      needs.changes.outputs.analyze == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             chmod +x .venv/bin/python3
             uv run pytest tests/qa/test_phase4_integration.py -v --tb=short

  qa-benchmark:
    name: "QA: Benchmark"
    runs-on: ubuntu-latest
    needs: [qa-analyze-integration, changes]
    if: |
      needs.changes.outputs.analyze == 'true' || 
      needs.changes.outputs.rust == 'true' || 
      needs.changes.outputs.workflow == 'true' || 
      needs.changes.outputs.qa_infra == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/run-tests
        with:
          uv-version: ${{ env.UV_VERSION }}
          command: |
             chmod +x .venv/bin/python3
             uv run python benchmark_projects.py --all

  coverage:
    name: Code Coverage
    needs: [changes]
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Verify Rust Toolchain
        run: rustup show
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Setup Velo
        uses: ./.github/actions/setup-velo
        with:
          python-version: '3.11'
          uv-version: ${{ env.UV_VERSION }}

      - name: Pre-Flight Diagnostic
        run: cargo llvm-cov nextest -- debug pre-flight

      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      
      - name: Check coverage threshold (70%)
        run: cargo llvm-cov report --fail-under-lines 70
        continue-on-error: true  # Warning only for now
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
