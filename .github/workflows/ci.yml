name: CI

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

env:
  CARGO_TERM_COLOR: always
  # Lock versions for consistency between local and CI
  RUST_VERSION: "1.92.0"
  UV_VERSION: "0.5"

jobs:
  build:
    name: Build & Test
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install pytest

      - name: Build
        run: cargo build --release

      - name: Run tests
        run: uv run run_tests.py

      - name: Check binary size
        run: |
          echo "Binary size:"
          ls -lh target/release/velo

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy
      - run: cargo clippy --all-targets --all-features -- -D warnings

  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt
      - run: cargo fmt --all -- --check

  # ============================================
  # QA Test Suite - Layered by Purpose
  # ============================================
  
  qa-zygote-core:
    name: "QA: Zygote Core E2E"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Test: E2E Real User Environment"
        run: uv run python -m pytest tests/qa/test_phase3_e2e_real_env.py -v --tb=short

  qa-zygote-security:
    name: "QA: Zygote Security Scan"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Test: IPC Security (path traversal, injection, DoS)"
        run: uv run python -m pytest tests/qa/test_phase3_security.py -v --tb=short

  qa-zygote-deployment:
    name: "QA: Zygote Deployment Scenarios"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Test: Deployment Structures (pip, brew, cargo install)"
        run: uv run python -m pytest tests/qa/test_phase3_deployment.py -v --tb=short

  qa-zygote-stress:
    name: "QA: Zygote Stress & Attack"
    runs-on: ubuntu-latest
    needs: build
    # Allow failures - stress tests may be flaky
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Test: Weird Environments (paths, permissions, signals)"
        run: uv run python -m pytest tests/qa/test_phase3_weird_env.py -v --tb=short
      
      - name: "Test: Brutal Attacks (resource exhaustion, DoS)"
        run: uv run python -m pytest tests/qa/test_phase3_brutal_attacks.py -v --tb=short

  # ============================================
  # Phase 3.5: Tiered QA Testing (velo serve)
  # ============================================

  qa-serve-smoke:
    name: "QA 3.5: Smoke (Tier 0)"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest requests psutil
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Tier 0: Smoke Tests (~3s)"
        run: ./scripts/qa-fast.sh 0

  qa-serve-fast:
    name: "QA 3.5: Fast (Tier 1)"
    runs-on: ubuntu-latest
    needs: qa-serve-smoke
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest requests psutil
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Tier 1: Fast Tests (~15s)"
        run: ./scripts/qa-fast.sh 1

  qa-serve-standard:
    name: "QA 3.5: Standard (Tier 2)"
    runs-on: ubuntu-latest
    needs: qa-serve-fast
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest requests psutil
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Tier 2: Standard Tests (~7min)"
        run: ./scripts/qa-fast.sh 2

  qa-serve-heavy:
    name: "QA 3.5: Heavy (Tier 3)"
    runs-on: ubuntu-latest
    needs: qa-serve-standard
    # Only run on main branch - heavy tests are optional
    if: github.ref == 'refs/heads/main'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest requests psutil
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Tier 3: Heavy/Brutal Tests (~5min)"
        run: ./scripts/qa-fast.sh 3

  # ============================================
  # Phase 4.0: velo analyze QA
  # ============================================

  qa-analyze-core:
    name: "QA 4.0: Analyze Core"
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Phase 4.0: Core + Agent Tests"
        run: |
          chmod +x .venv/bin/python3
          uv run pytest tests/qa/test_phase4_analyze.py tests/qa/test_phase4_agent_*.py -v --tb=short

  qa-analyze-integration:
    name: "QA 4.0: Integration (SLOW)"
    runs-on: ubuntu-latest
    needs: qa-analyze-core
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Phase 4.0: Integration Tests (Real Projects)"
        run: |
          chmod +x .venv/bin/python3
          uv run pytest tests/qa/test_phase4_integration.py -v --tb=short

  qa-benchmark:
    name: "QA: Benchmark"
    runs-on: ubuntu-latest
    needs: qa-analyze-integration
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
      
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: ${{ env.UV_VERSION }}
      
      - name: Setup Python environment
        run: |
          uv venv --python 3.11
          uv pip install pytest
      
      - name: Build release binary
        run: cargo build --release
      
      - name: "Benchmark: Performance Validation"
        run: |
          chmod +x .venv/bin/python3
          uv run python benchmark_projects.py --all

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust ${{ env.RUST_VERSION }}
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: llvm-tools-preview
      
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      
      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest
      
      - name: Run tests with coverage
        run: cargo llvm-cov nextest --lcov --output-path lcov.info
      
      - name: Check coverage threshold (70%)
        run: cargo llvm-cov report --fail-under-lines 70
        continue-on-error: true  # Warning only for now
      
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
