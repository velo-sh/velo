[meta]
package = "boto3"
category = "library"
tier = 3
description = "The AWS SDK for Python."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/boto/boto3.git"
git_ref = "1.34.69"
test_path = "tests/unit"
test_dependencies = ["pytest", "botocore", "s3transfer"]
pytest_args = ["-x", "--timeout=60"]
timeout = 300
known_failures = []
