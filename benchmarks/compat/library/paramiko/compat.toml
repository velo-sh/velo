[meta]
package = "paramiko"
category = "library"
tier = 3

description = "paramiko compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/paramiko/paramiko.git"
git_ref = "3.4.0"
test_path = "tests"
test_dependencies = ["pytest", "icecream", "pytest-relaxed"]
pytest_args = ["-x", "tests/test_util.py"]
timeout = 300
known_failures = []
