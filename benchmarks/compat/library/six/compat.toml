[meta]
package = "six"
category = "library"
tier = 3
description = "Python 2 and 3 compatibility utilities."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/benjaminp/six.git"
git_ref = "1.16.0"
test_path = "."
test_dependencies = ["pytest"]
pytest_args = ["test_six.py", "-x"]
timeout = 300
known_failures = []
