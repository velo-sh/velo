[meta]
package = "httpx"
category = "library"
tier = 3
description = "A next generation HTTP client for Python."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/encode/httpx.git"
git_ref = "0.27.0"
test_path = "tests"
test_dependencies = ["pytest", "trio", "anyio", "trustme", "h2", "chardet"]
pytest_args = ["-x", "--timeout=60", "-m", "not network"]
timeout = 300
known_failures = []
