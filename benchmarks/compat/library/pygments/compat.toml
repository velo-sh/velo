[meta]
package = "pygments"
category = "library"
tier = 3

description = "pygments compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/pygments/pygments.git"
git_ref = "2.17.2"
test_path = "tests"
test_dependencies = ["pytest", "wcag-contrast-ratio"]
pytest_args = ["-x", "-p", "no:relaxed"]
timeout = 300
known_failures = []
