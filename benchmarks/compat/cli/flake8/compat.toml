[meta]
package = "flake8"
category = "cli"
tier = 3

description = "flake8 compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/PyCQA/flake8.git"
git_ref = "6.1.0"
test_path = "tests"
test_dependencies = ["pytest"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
