[meta]
package = "black"
category = "cli"
tier = 3
description = "The uncompromising code formatter."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/psf/black.git"
git_ref = "24.10.0"
test_path = "tests"
test_dependencies = ["pytest", "click", "pathspec", "platformdirs", "mypy_extensions"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
