[meta]
package = "rich"
category = "cli"
tier = 3
description = "Render rich text, tables, progress bars, syntax highlighting, markdown and more to the terminal."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/Textualize/rich.git"
git_ref = "v13.7.1"
test_path = "tests"
test_dependencies = ["pytest", "pygments", "ipython"]
pytest_args = ["-x", "--timeout=60"]
timeout = 300
known_failures = []
