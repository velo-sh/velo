[meta]
package = "starlette"
category = "web"
tier = 3
description = "The little ASGI framework that shines."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/encode/starlette.git"
git_ref = "0.41.3"
test_path = "tests"
test_dependencies = ["pytest", "anyio", "httpx", "python-multipart", "jinja2", "pyyaml", "sniffio", "trio"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
