[meta]
package = "fastapi"
category = "web"
tier = 1
description = "FastAPI framework, high performance, easy to learn"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/fastapi/fastapi.git"
git_ref = "0.115.6"
test_path = "tests"
test_dependencies = [
    "pytest", "httpx", "pytest-asyncio", "pydantic-settings", 
    "dirty-equals", "pyyaml", "passlib", "python-multipart", 
    "sqlalchemy", "email-validator", "starlette", "cryptography",
    "orjson"
]
pytest_args = ["-x", "-m", "not slow", "--ignore=tests/test_tutorial"]
exclude_markers = ["slow"]
timeout = 300
