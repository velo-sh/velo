repos:
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.8.0
    hooks:
      - id: mypy
        name: mypy (zygote)
        files: ^velo_zygote/
        additional_dependencies: [types-requests, types-psutil]

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt --all
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint and fix Rust code
        entry: cargo clippy --fix --allow-dirty --workspace --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
