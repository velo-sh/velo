repos:
  - repo: local
    hooks:
      - id: mypy
        name: mypy (zygote)
        entry: uv run mypy
        language: system
        files: ^velo_zygote/
        types: [python]
        pass_filenames: true

  - repo: local
    hooks:
      - id: cargo-fmt
        name: cargo fmt
        description: Format Rust code
        entry: cargo fmt --all
        language: system
        files: \.rs$
        pass_filenames: false

      - id: cargo-clippy
        name: cargo clippy
        description: Lint and fix Rust code
        entry: cargo clippy --fix --allow-dirty --workspace --all-targets -- -D warnings
        language: system
        files: \.rs$
        pass_filenames: false
