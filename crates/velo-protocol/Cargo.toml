[package]
name = "velo-protocol"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[lints]
workspace = true

[dependencies]
serde = { version = "1.0", features = ["derive"] }
rmp-serde = "1.3"
uuid = { version = "1.7", features = ["v4", "v7"] }
arbitrary = { version = "1.3", features = ["derive"], optional = true }
# Protocol uses PathBuf for script/socket paths
# We avoid unnecessary L7 deps here to keep it pure.

[build-dependencies]
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

[features]
fuzz = ["arbitrary"]
