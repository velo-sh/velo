[package]
name = "velo-test"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
velo-core = { path = "../velo-core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
colored = "2.0"
clap = { version = "4.5.54", features = ["derive"] }
tokio = { version = "1", features = ["full", "net"] }
uuid = { version = "1.7", features = ["v4", "v7"] }
indicatif = "0.17"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["socket", "uio", "fs", "process"] }
