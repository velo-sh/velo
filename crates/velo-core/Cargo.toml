[package]
name = "velo-core"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
build = "build.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
socket2 = { version = "0.6", features = ["all"] }
pyo3 = { version = "0.27", features = ["anyhow", "bytes", "generate-import-lib"] }
velo_macros = { path = "../../velo_macros" }
bytes = "1"
blake3 = "1.5"
hex = "0.4"
anyhow = "1.0"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
tempfile = "3"
crc32fast = "1.4"
thiserror = "1.0"
chrono = "0.4"
hostname = "0.4"
rustpython-parser = "0.4"
rustpython-ast = "0.4"
ignore = "0.4"
log = "0.4"
env_logger = "0.11"
tracing = "0.1"
dirs = "5.0"
which = "6.0"
goblin = "0.9"
rmp-serde = "1.3"
once_cell = "1.19"
uuid = { version = "1.7", features = ["v4", "v7"] }
colored = "2.0"
indicatif = "0.17"
regex = "1.10"
strsim = "0.11"
tokio = { version = "1", features = ["full", "net"] }
futures-util = "0.3"
tokio-tungstenite = "0.21"
parking_lot = "0.12"
notify = "6.1"
rayon = "1.10"
toml = "0.8"

[build-dependencies]
blake3 = "1.5"
toml = "0.8"
serde = { version = "1.0", features = ["derive"] }

[features]
default = ["embedded_uv", "granian_native"]
embedded_uv = []
granian_native = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
fs2 = "0.4"
nix = { version = "0.27", features = ["socket", "uio", "fs", "process"] }
