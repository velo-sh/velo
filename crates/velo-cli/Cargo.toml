[package]
name = "velo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[[bin]]
name = "velo"
path = "src/main.rs"

[dependencies]
velo-core = { path = "../velo-core" }
velo-serve = { path = "../velo-serve" }
velo-test = { path = "../velo-test" }
anyhow = "1.0"
clap = { version = "4.5.54", features = ["derive"] }
colored = "2.0"
log = "0.4"
env_logger = "0.11"
strsim = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
indicatif = "0.17"
uuid = { version = "1.7", features = ["v4", "v7"] }
rkyv = { version = "0.8.12", features = ["bytecheck"] }
pyo3 = { version = "0.27", features = ["anyhow", "bytes", "generate-import-lib"] }
blake3 = "1.5"
hex = "0.4"
rayon = "1.10"
chrono = "0.4"
rmp-serde = "1.3"
tempfile = "3"
which = "6.0"
dirs = "5.0"
ignore = "0.4"
rustpython-parser = "0.4"
rustpython-ast = "0.4"
goblin = "0.9"
hostname = "0.4"
glob = "0.3"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["socket", "uio", "fs", "process"] }
