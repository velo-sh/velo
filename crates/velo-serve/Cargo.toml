[package]
name = "velo-serve"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
velo-core = { path = "../velo-core" }
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
colored = "2.0"
clap = { version = "4.5.54", features = ["derive"] }
notify = "6.1"
signal-hook = "0.3"
tiny_http = "0.12"
strsim = "0.11"
regex = "1.10"
uuid = { version = "1.7", features = ["v4", "v7"] }
hyper = { version = "1.4", features = ["full", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
tokio = { version = "1", features = ["full", "net"] }
tokio-stream = "0.1"
tower = "0.5"
tower-service = "0.3"
http = "1.1"
http-body-util = "0.1"
pin-project-lite = "0.2"
granian-core = { path = "../../vendor/granian" }
glob = "0.3.3"
futures-util = "0.3"
parking_lot = "0.12"
tokio-tungstenite = "0.21"
once_cell = "1.19"
rayon = "1.10"
pyo3 = { version = "0.27", features = ["anyhow", "bytes", "generate-import-lib"] }
chrono = "0.4"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
indicatif = "0.17"
thiserror = "1.0"
socket2 = { version = "0.6", features = ["all"] }
blake3 = "1.5"
hex = "0.4"
tempfile = "3"
rmp-serde = "1.3"

[features]
granian_native = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["socket", "uio", "fs", "process"] }
