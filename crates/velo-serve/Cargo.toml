[package]
name = "velo-serve"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

[lints]
workspace = true

[dependencies]
velo-core = { path = "../velo-core" }
anyhow = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }
colored = { workspace = true }
clap = { workspace = true }
notify = { workspace = true }
signal-hook = "0.3"
tiny_http = "0.12"
strsim = { workspace = true }
regex = { workspace = true }
uuid = { workspace = true }
hyper = { version = "1.4", features = ["full", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
tokio = { workspace = true }
tokio-stream = "0.1"
tower = "0.5"
tower-service = "0.3"
http = "1.1"
http-body-util = "0.1"
pin-project-lite = "0.2"
granian-core = { path = "../../vendor/granian" }
glob = "0.3.3"
futures-util = { workspace = true }
parking_lot = { workspace = true }
tokio-tungstenite = "0.21"
once_cell = "1.19"
rayon = { workspace = true }
pyo3 = { version = "0.27", features = ["anyhow", "bytes", "generate-import-lib"] }
chrono = { workspace = true }
rkyv = { workspace = true }
indicatif = { workspace = true }
thiserror = { workspace = true }
socket2 = { workspace = true }
blake3 = { workspace = true }
hex = { workspace = true }
tempfile = { workspace = true }
rmp-serde = { workspace = true }
velo-protocol = { workspace = true }

[features]
granian_native = []

[target.'cfg(unix)'.dependencies]
libc = "0.2"
nix = { version = "0.27", features = ["socket", "uio", "fs", "process"] }
