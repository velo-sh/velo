[meta]
package = "virtualenv"
category = "cli"
tier = 3

description = "virtualenv compatibility test"

[compat]
sys_path_strategy = "installed"
source = "git"
git_repo = "https://github.com/pypa/virtualenv.git"
git_ref = "20.24.6"
test_path = "tests"
test_dependencies = ["pytest"]
run_cmd = ["/bin/sh", "-c", "rm tests/unit/create/console_app/setup.py && pytest tests"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
