[meta]
package = "alembic"
category = "cli"
tier = 3
description = "A database migrations tool for SQLAlchemy."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/sqlalchemy/alembic.git"
git_ref = "rel_1_15_0"
test_path = "tests"
test_dependencies = ["pytest", "sqlalchemy", "mock", "mako"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
