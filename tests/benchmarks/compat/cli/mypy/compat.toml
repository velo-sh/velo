[meta]
package = "mypy"
category = "cli"
tier = 3

description = "mypy compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/python/mypy.git"
git_ref = "v1.7.1"
test_path = "mypy/test"
test_dependencies = ["pytest"]
pytest_args = ["-x", "-p", "no:relaxed", "-p", "no:xdist", "-o", "addopts="]
timeout = 300
known_failures = []
