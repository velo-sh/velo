[meta]
package = "redis-py"
category = "library"
tier = 3
description = "Redis Python Client."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/redis/redis-py.git"
git_ref = "v5.0.3"
test_path = "tests"
test_dependencies = ["pytest", "mock", "packaging", "pytest-asyncio", "async-timeout"]
pytest_args = ["-x", "--timeout=60", "-m", "not (only_cluster or redismod or slow)"]
timeout = 300
known_failures = []
