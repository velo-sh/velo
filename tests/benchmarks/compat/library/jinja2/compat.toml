[meta]
package = "jinja2"
category = "library"
tier = 3
description = "A very fast and expressive template engine."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/pallets/jinja.git"
git_ref = "3.1.4"
test_path = "tests"
test_dependencies = ["pytest", "markupsafe"]
pytest_args = ["-x", "--timeout=60"]
timeout = 300
known_failures = []
