[meta]
package = "python-dateutil"
category = "library"
tier = 3
description = "Extensions to the standard Python datetime module."

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/dateutil/dateutil.git"
git_ref = "2.9.0"
test_path = "tests"
test_dependencies = ["pytest", "six", "pretend", "freezegun"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
