[meta]
package = "zipp"
category = "library"
tier = 3

description = "zipp compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/jaraco/zipp.git"
git_ref = "v3.15.0"
test_path = "tests"
test_dependencies = ["pytest", "more-itertools", "jaraco.functools", "jaraco.itertools", "jaraco.test"]
pytest_args = ["-x"]
timeout = 300
known_failures = []
