[meta]
package = "jsonschema"
category = "library"
tier = 3
description = "An implementation of the JSON Schema specification for Python."

[compat]
sys_path_strategy = "installed"
source = "git"
git_repo = "https://github.com/python-jsonschema/jsonschema.git"
git_ref = "v4.21.1"
test_path = "jsonschema/tests"
test_dependencies = ["pytest", "attrs", "referencing", "jsonschema-specifications"]
pytest_args = ["-x", "--timeout=60"]
timeout = 300
known_failures = []
