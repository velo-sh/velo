[meta]
package = "werkzeug"
category = "web"
tier = 0

description = "werkzeug compatibility test"

[compat]
sys_path_strategy = "source"
source = "git"
git_repo = "https://github.com/pallets/werkzeug.git"
git_ref = "3.0.1"
test_path = "tests"
test_dependencies = ["pytest", "pytest-xprocess", "cryptography", "markupsafe", "ephemeral_port_reserve", "watchdog"]
pytest_args = ["-x", "-p", "no:relaxed"]
timeout = 300
known_failures = []
