# Velo Shared Constants (RFC-0012 SSOT)
# Auto-generated into src/common/constants.rs and velo_zygote/constants.py

protocol_version = 1
python_version = "3.11"
socket_path_limit = 104
# IPC Message Size Limits
# max_message_size: Control messages (Fork, Status, Shutdown, etc.)
#   - 64KB is sufficient for all IPC commands (typically < 10KB)
#   - Conservative compared to gRPC (4MB) and Uvicorn WebSocket (1MB)
#   - Large data should use SHM (shared memory) via file descriptors
# max_data_message_size: Reserved for future inline data transfer
#   - Not currently used; data goes via SHM
#   - Consider 4MB (gRPC standard) if inline data is needed
max_message_size = 65536  # 64KB - control messages only

# Files and Directories (Magic Strings)
pyproject_toml = "pyproject.toml"
uv_lock = "uv.lock"
requirements_txt = "requirements.txt"
site_customize = "sitecustomize.py"
velo_loader = "velo_loader.py"
velo_cache_dir = ".velo_cache"
velo_profile_json = "velo_profile.json"

# Timeouts (Seconds)
socket_startup_timeout = 30
worker_handshake_timeout = 10
graceful_shutdown_timeout = 60
default_slow_threshold_ms = 100
# SLO: Error Budget Policy
slo_fork_latency_ms = 100 # P99 < 100ms
auto_sync_enabled = true # RFC-0018: Implicit 'uv sync' logic
strict_optimizations = true # H-Gov: Enabled in CI/Dev by default
sandbox_network_isolation = true # RFC-0011: Enable network namespace isolation
sandbox_privilege_escalation_block = true # RFC-0011: PR_SET_NO_NEW_PRIVS

circuit_breaker_enabled = true
metrics_enabled = true
tracing_enabled = true
zygote_pool_size = 5 # Default number of warm workers

# Network
default_host = "127.0.0.1"
default_port = 8000

# Security (RFC-0012)
# Supported Placeholders: ${CWD}, ${HOME}, ${EXE_DIR}, ${VIRTUAL_ENV}, ${CONDA_PREFIX}

# Security Matrix (RFC-0012)
# Hierarchy: Base -> OS_Base -> OS_Env
# Placeholders: ${CWD}, ${HOME}, ${EXE_DIR}, ${VIRTUAL_ENV}, ${CONDA_PREFIX}, ${BASE}, ${OS_BASE}

# Level 0: Global Base
security_base_trusted_prefixes = "/usr,/bin,/sbin,/lib,/Library/Frameworks,/Library/Developer/CommandLineTools,${HOME}/.local/share/velo/ci,${HOME}/Library/Python,${HOME}/.local/lib,${HOME}/.local/bin,${HOME}/.local/share/uv/python,${VIRTUAL_ENV}"
security_base_env_whitelist = "PATH,HOME,USER,LOGNAME,PWD,TMPDIR,PYTHONUNBUFFERED,LANG,LC_ALL,LC_CTYPE,TZ,TERM,MallocNanoZone,VELO_ENV,VELO_TEST_MODE,VELO_ZYGOTE_SOCKET,VELO_ZYGOTE_SOCKET_TIMEOUT,VELO_ZYGOTE_AUTH,VELO_TIMEOUT_MULTIPLIER,VELO_STRICT_NUMA,VELO_ZYGOTE_SHIELD_ACTIVE,VELO_WORKER_DEBUG_LOG,VIRTUAL_ENV,CI,GITHUB_ACTIONS,__CFBundleIdentifier,VELO_IS_ZYGOTE,VELO_WORKER_ID,VELO_NATIVE_PRELOAD_STRICT,VELO_IMPORT_THRESHOLD_MS"

# Blocked Paths (RFC-0012)
default_blocked_paths = ["/usr", "/bin", "/sbin", "/etc", "/root", "/boot", "/home"]


# Level 1: macOS Defaults
security_macos_base_trusted_prefixes = "${BASE},/opt/homebrew,/opt/local,/usr/local"
security_macos_base_env_whitelist = "${BASE},__CF_USER_TEXT_ENCODING,XPC_FLAGS,XPC_SERVICE_NAME,TERM_PROGRAM"

# Level 1: Linux Defaults
security_linux_base_trusted_prefixes = "${BASE},/lib64,/etc/ssl/certs"
security_linux_base_env_whitelist = "${BASE},XDG_RUNTIME_DIR"

# Level 2: Environment Overlays
# Dev (Permissive)
security_macos_dev_trusted_prefixes = "${OS_BASE},${HOME},${VIRTUAL_ENV},${CONDA_PREFIX}"
security_macos_dev_env_whitelist = "${OS_BASE},SHELL,VIRTUAL_ENV,CONDA_PREFIX,PYTHONHOME,DYLD_LIBRARY_PATH,DYLD_FALLBACK_LIBRARY_PATH"

security_linux_dev_trusted_prefixes = "${OS_BASE},${HOME},${VIRTUAL_ENV},${CONDA_PREFIX}"
security_linux_dev_env_whitelist = "${OS_BASE},SHELL,VIRTUAL_ENV,CONDA_PREFIX,LD_LIBRARY_PATH"

# CI (Automated)
security_macos_ci_trusted_prefixes = "${OS_BASE},/opt/hostedtoolcache,${HOME},${VIRTUAL_ENV}"
security_macos_ci_env_whitelist = "${OS_BASE},GITHUB_ACTIONS,GITHUB_WORKSPACE,VIRTUAL_ENV,CONDA_PREFIX,SHELL"

security_linux_ci_trusted_prefixes = "${OS_BASE},/opt/hostedtoolcache,/home/runner,${HOME},${VIRTUAL_ENV}"
security_linux_ci_env_whitelist = "${OS_BASE},GITHUB_ACTIONS,GITHUB_WORKSPACE,VIRTUAL_ENV,CONDA_PREFIX,SHELL,LD_LIBRARY_PATH"

# Prod (Hardened)
security_macos_prod_trusted_prefixes = "${OS_BASE}"
security_macos_prod_env_whitelist = "${OS_BASE}"

security_linux_prod_trusted_prefixes = "${OS_BASE}"
security_linux_prod_env_whitelist = "${OS_BASE}"

security_hpc_threads = 1

# =============================================================================
# Paths Matrix (RFC-0012 Phase 6.5)
# =============================================================================
# Hierarchy: Base -> OS_Base -> OS_Env (same pattern as Security)
# Placeholders: ${TMPDIR}, ${HOME}, ${UID}, ${XDG_RUNTIME_DIR}

# Level 0: Path Templates (shared across all platforms)
path_socket_dir_name = "velo-${UID}"
path_log_dir_relative = ".local/state/velo"
path_cache_dir_name = ".velo/cache"

# DEF-SOCKET-STABLE: Use stable ~/.local/state/velo/sockets instead of TMPDIR
# macOS temp directories can be cleaned up unexpectedly, causing socket issues
path_macos_base_socket_parent = "${HOME}/.local/state/velo/sockets"

path_macos_base_log_parent = "${HOME}"
path_macos_base_xdg_fallback = "${TMPDIR}"

# Level 1: Linux Base Paths
path_linux_base_socket_parent = "${XDG_RUNTIME_DIR}"
path_linux_base_log_parent = "${HOME}"
path_linux_base_xdg_fallback = "${TMPDIR}"
path_linux_fd_dir = "/proc/self/fd"
path_macos_fd_dir = "/dev/fd"

# Level 2: Environment Overlays
# CI: Use XDG_RUNTIME_DIR for test isolation (falling back to /tmp if unset)
path_macos_ci_socket_parent = "${TMPDIR}"  # macOS usually uses /tmp, let's keep it simple unless we specifically export XDG
path_linux_ci_socket_parent = "${XDG_RUNTIME_DIR}"

# Prod: Same as base (no override needed)
# path_macos_prod_socket_parent = (inherits from base)
# path_linux_prod_socket_parent = (inherits from base)

# =============================================================================
# Python Environment SSOT (Phase 7.3+)
# =============================================================================
# This is the SINGLE SOURCE OF TRUTH for Python environment configuration.
# build.rs reads this to generate:
#   1. Rust constants in src/common/constants.rs
#   2. Python constants in velo_zygote/constants.py
#
# At runtime, common::python_env::PythonEnv uses these as validation baselines.

[python_environment]
# Required Python version for Velo
required_version = "3.11"

# Project venv path relative to project root
venv_path = ".venv"

# Lib dir subdirectory pattern (python{major}.{minor})
lib_dir_pattern = "lib/python{version}"

# C extension module subdirectory
lib_dynload_subdir = "lib-dynload"

# Environment variables set by Velo for native workers (SSOT)
env_vars = [
    "PYTHONHOME",           # Python base directory (stdlib location)
    "VELO_PYTHON_LIB_DIR",  # stdlib lib directory
    "VELO_PYTHON_LIB_DYNLOAD", # C extension modules
    "VIRTUAL_ENV",          # Virtual environment root
    "VELO_PYTHON_EXECUTABLE", # Python executable path
]

# =============================================================================
# Native Preloading SSOT (Phase 6 Hardening)
# =============================================================================
[native_preload]
runtime_prefix = "_v_"
lock_env = "VELO_RUNTIME_PRELOAD_LOCK"
exe_path_env = "VELO_RUNTIME_EXE_PATH"
strict_env = "VELO_RUNTIME_STRICT"
stage_pre_init = "PreInit"
stage_post_init = "PostInit"
# Path integrity check mode: "enforce" | "warn" | "off"
# - enforce: Block libraries outside trusted boundaries (strict security)
# - warn: Log warning but allow loading (default, backwards-compatible)
# - off: Disable path integrity checks entirely
path_integrity = "warn"

