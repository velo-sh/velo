# Embedded Assets Configuration
# 
# This file declares all embedded binaries and their platform-specific variants.
# Build.rs reads this file and downloads the appropriate asset for the target platform.
#
# Benefits:
# - Single source of truth for versions
# - Easy version upgrades (just change version number)
# - Platform matrix is visible and maintainable
# - Optional SHA256 verification for security

[uv]
# UV Python package manager - https://github.com/astral-sh/uv
version = "0.9.24"
base_url = "https://github.com/astral-sh/uv/releases/download"
# Cache downloaded assets in assets/ directory
cache_dir = "assets"
# Enable BLAKE3 hash verification
verify_hash = true

# Platform matrix: [os-arch] -> asset configuration
# Build.rs will select the matching entry based on: (std::env::consts::OS, std::env::consts::ARCH)

[[uv.platforms]]
os = "macos"
arch = "aarch64"
asset_name = "uv-aarch64-apple-darwin"
archive = "uv-aarch64-apple-darwin.tar.gz"
# SHA256 of the tar.gz file (optional, for integrity verification)
# sha256 = "..."

[[uv.platforms]]
os = "macos"
arch = "x86_64"
asset_name = "uv-x86_64-apple-darwin"
archive = "uv-x86_64-apple-darwin.tar.gz"

[[uv.platforms]]
os = "linux"
arch = "x86_64"
asset_name = "uv-x86_64-unknown-linux-musl"
archive = "uv-x86_64-unknown-linux-musl.tar.gz"

[[uv.platforms]]
os = "linux"
arch = "aarch64"
asset_name = "uv-aarch64-unknown-linux-musl"
archive = "uv-aarch64-unknown-linux-musl.tar.gz"

# Windows support (future)
