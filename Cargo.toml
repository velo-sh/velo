[package]
name = "velo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The high-performance runtime for the AI era."

[lints.rust]
unsafe_code = "allow" # Required for Unix signals and UDS integration
unused_imports = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
# RFC-0010: Core SSoT requirement
collapsible_if = "deny"
# Temporarily allow these to stabilize the transition to SSoT
uninlined_format_args = "allow"
needless_pass_by_value = "allow"
multiple_crate_versions = "allow"
almost_swapped = "deny" # Just an example of a good catch-all

[[bin]]
name = "velo"
path = "src/main.rs"

[lib]
name = "velo"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1"
blake3 = "1.5"
hex = "0.4"
anyhow = "1.0"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
tempfile = "3"
crc32fast = "1.4"
thiserror = "1.0"
chrono = "0.4"
hostname = "0.4"
rustpython-parser = "0.4"
rustpython-ast = "0.4"
ignore = "0.4"
log = "0.4"
env_logger = "0.11"      # RFC-0020: Global structured logging
tracing = "0.1"          # RFC-0018: Structured tracing for custody
dirs = "5.0"             # RFC-0018: Cross-platform home directory
which = "6.0"            # RFC-0018: System binary lookup

# Phase 6.1: velo serve enhancements
notify = "6.1"           # File system watching
signal-hook = "0.3"      # Unix signal handling
colored = "2.0"          # Terminal colors
tiny_http = "0.12"       # Minimal HTTP for health checks
strsim = "0.11"          # "Did you mean?" suggestions
regex = "1.10"           # Strict security validation (SEC-P0-001)
clap = { version = "4.5.54", features = ["derive"] }
rmp-serde = "1.3"        # MessagePack for high-perf IPC

# RFC-0011: L7 Proxy + UDS Worker architecture
uuid = { version = "1.7", features = ["v4", "v7"] }
hyper = { version = "1.4", features = ["full", "http1", "http2"] }
hyper-util = { version = "0.1", features = ["full", "tokio"] }
tokio = { version = "1", features = ["full", "net"] }
tokio-stream = "0.1"
tower = "0.5"
tower-service = "0.3"
http = "1.1"
http-body-util = "0.1"
pin-project-lite = "0.2"

# RFC-0019: Vendored Granian Core for Native Sovereignty
granian-core = { path = "vendor/granian" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
fs2 = "0.4"
signal-hook = "0.3"      # Platform-specific signal handling
nix = { version = "0.27", features = ["socket", "uio", "fs"] } # SCM_RIGHTS support

[features]
default = ["embedded_uv"]
embedded_uv = []  # RFC-0018: Embed uv binary at build time

[build-dependencies]
blake3 = "1.5"    # RFC-0018: Hash generation for uv verification
toml = "0.8"      # RFC-0018: Parse embedded_assets.toml config

[dev-dependencies]

[profile.release]
lto = "fat"           # Most aggressive LTO
strip = "symbols"     # Strip all symbols
codegen-units = 1     # Better optimization
opt-level = 3         # Optimize for speed (was z)
panic = "abort"       # Smaller panic handling
