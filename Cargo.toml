[package]
name = "velo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

description = "The high-performance runtime for the AI era."

[[bin]]
name = "velo"
path = "src/main.rs"

[lib]
name = "velo"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
blake3 = "1.5"
hex = "0.4"
anyhow = "1.0"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
tempfile = "3"
crc32fast = "1.4"
thiserror = "1.0"
chrono = "0.4"
hostname = "0.4"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
fs2 = "0.4"

[dev-dependencies]

[profile.release]
lto = "fat"           # Most aggressive LTO
strip = "symbols"     # Strip all symbols
codegen-units = 1     # Better optimization
opt-level = "z"       # Optimize for size
panic = "abort"       # Smaller panic handling
