[workspace]
resolver = "2"
members = [
    "crates/velo-core",
    "crates/velo-serve",
    "crates/velo-test",
    "crates/velo-cli",
    "velo_macros",
]
default-members = ["crates/velo-cli"]

# Shared profile settings
[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 2
lto = "thin"
strip = "none"
debug = 1
codegen-units = 16
panic = "unwind"

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false
