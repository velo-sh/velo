[package]
name = "velo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

description = "The high-performance runtime for the AI era."

[[bin]]
name = "velo"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
anyhow = "1.0"
rkyv = { version = "0.8.12", features = ["bytecheck"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "fat"           # Most aggressive LTO
strip = "symbols"     # Strip all symbols
codegen-units = 1     # Better optimization
opt-level = "z"       # Optimize for size
panic = "abort"       # Smaller panic handling
