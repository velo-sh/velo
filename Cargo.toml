[workspace]
resolver = "2"
members = [
    "crates/velo-core",
    "crates/velo-graph",
    "crates/velo-serve",
    "crates/velo-test",
    "crates/velo-cli",
    "crates/velo-protocol",
    "velo_macros",
    "vendor/granian",
]
default-members = ["crates/velo-cli"]

[workspace.lints.rust]
# Allow too_many_arguments due to vendored code (granian)
# This allows us to resume strict CI/CD without --no-verify
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(sandbox_disabled)', 'cfg(PyPy)', 'cfg(Py_3_10)', 'cfg(Py_GIL_DISABLED)'] }

[workspace.lints.clippy]
# Global strictness restored.
# Specific allowances will be moved to vendor/granian.

# Shared profile settings
[profile.dev]
opt-level = 0
debug = true
split-debuginfo = "unpacked"
incremental = true

[profile.release]
opt-level = 2
lto = "thin"
strip = "none"
debug = 1
codegen-units = 16
panic = "unwind"

[profile.production]
inherits = "release"
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
debug = false

[workspace.dependencies]
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
colored = "2.0"
clap = { version = "4.5.54", features = ["derive"] }
notify = "6.1"
strsim = "0.11"
regex = "1.10"
uuid = { version = "1.7", features = ["v4", "v7"] }
tokio = { version = "1", features = ["full", "net"] }
futures-util = "0.3"
parking_lot = "0.12"
rayon = "1.10"
toml = "0.8"
chrono = "0.4"
rkyv = { version = "0.8.12", features = ["bytecheck"] }
indicatif = "0.17"
thiserror = "1.0"
socket2 = { version = "0.6", features = ["all"] }
blake3 = "1.5"
hex = "0.4"
tempfile = "3"
rmp-serde = "1.3"
once_cell = "1.19"
smallvec = "1.13"
velo-protocol = { path = "crates/velo-protocol" }
