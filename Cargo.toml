[package]
name = "velo"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"

description = "The high-performance runtime for the AI era."

[dependencies]
pyo3 = { version = "0.20", features = ["auto-initialize"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
hex = "0.4"
clap = { version = "4.4", features = ["derive"] }
walkdir = "2.4"
anyhow = "1.0"

[profile.release]
lto = true
strip = true
codegen-units = 1