#!/bin/bash
# =============================================================================
# Velo Test Suite Configuration (SSOT)
# =============================================================================
# This file defines ALL test paths for the entire project.
# All CI scripts (local-ci.sh, Docker, GitHub Actions) should source this file.
#
# RULE: Do Not Repeat Yourself - update tests HERE, not in individual scripts!
# =============================================================================

# -----------------------------------------------------------------------------
# Tier 0: Unit Tests (No external deps, < 30s)
# All commits must pass these locally before push.
# -----------------------------------------------------------------------------
TIER0_TESTS=(
    "tests/qa/heavy/stability/test_fingerprint.py"
)

# -----------------------------------------------------------------------------
# Tier 1: Integration Tests (Needs velo binary, < 2min)
# Fast feedback loop, must pass in local-ci and Docker.
# -----------------------------------------------------------------------------
TIER1_TESTS=(
    "tests/qa/heavy/chaos/test_phase6_2_env_pollution.py"
    "tests/qa/heavy/stability/test_phase6_2_regression.py"
    "tests/qa/heavy/stress/test_phase3_5_agent_d_destroyer.py"
    "tests/qa/heavy/chaos/test_phase6_2_agent_d_destroyer.py"
    "tests/qa/heavy/chaos/test_kinetic_protocol_integrity.py"
)

# -----------------------------------------------------------------------------
# Tier 2: E2E Tests (Full runtime, < 5min)
# Zygote integration, worker lifecycle, proxy flow.
# -----------------------------------------------------------------------------
TIER2_TESTS=(
    "tests/qa/heavy/chaos/test_isolation.py"
    "tests/qa/heavy/stability/test_phase611_smoke.py"
    "tests/qa/heavy/stability/test_phase611_golden_path.py"
    "tests/qa/heavy/chaos/test_phase611_features.py"
    "tests/qa/heavy/perf/test_phase611_integration.py"
)

# -----------------------------------------------------------------------------
# Tier 3: Hardened Security & Stability (< 5min)
# Battle-tested adversarial scenarios.
# -----------------------------------------------------------------------------
TIER3_TESTS=(
    "tests/qa/heavy/chaos/test_phase6_1_security_hardened.py"
    "tests/qa/heavy/perf/test_phase6_1_stability_hardened.py"
    "tests/qa/heavy/chaos/test_phase3_ipc_attacks.py"
)

# -----------------------------------------------------------------------------
# Tier 4: Platform-Specific (Linux-only, macOS-only)
# Run conditionally based on platform.
# -----------------------------------------------------------------------------
TIER4_LINUX_TESTS=(
    # Tests that require Linux-specific features (Abstract Sockets, NUMA, etc.)
)

# -----------------------------------------------------------------------------
# Tier 5: Phase Suites (Full E2E integration per phase)
# These run as directories in CI for auto-discovery of new tests.
# -----------------------------------------------------------------------------
TIER5_PHASE_TESTS=(
    "tests/qa/heavy/chaos"
    "tests/qa/heavy/perf"
    "tests/qa/heavy/stability"
    "tests/qa/heavy/stress"
    "tests/qa/phase_6_1_1"
)

# -----------------------------------------------------------------------------
# Helper: Get space-separated paths for pytest
# Usage: $(get_test_paths TIER1_TESTS[@])
# -----------------------------------------------------------------------------
get_test_paths() {
    local paths=("$@")
    echo "${paths[*]}"
}

# -----------------------------------------------------------------------------
# Composite Test Suites
# -----------------------------------------------------------------------------
# Quick local checks (Tier 0 + Tier 1)
QUICK_TESTS=("${TIER0_TESTS[@]}" "${TIER1_TESTS[@]}")

# Full Docker CI (Tier 0 + Tier 1 + Tier 2 + Tier 3)
DOCKER_CI_TESTS=("${TIER0_TESTS[@]}" "${TIER1_TESTS[@]}" "${TIER2_TESTS[@]}" "${TIER3_TESTS[@]}")

# Full CI (all tiers including phases)
FULL_CI_TESTS=("${DOCKER_CI_TESTS[@]}" "${TIER5_PHASE_TESTS[@]}")

# Export for subprocesses (space-separated for pytest)
export TEST_PATHS_QUICK="${QUICK_TESTS[*]}"
export TEST_PATHS_DOCKER="${DOCKER_CI_TESTS[*]}"
export TEST_PATHS_FULL="${FULL_CI_TESTS[*]}"
export TEST_PATHS_PHASES="${TIER5_PHASE_TESTS[*]}"
