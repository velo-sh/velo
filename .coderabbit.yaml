# .coderabbit.yaml
version: "2"

# Core review settings
reviews:
  profile: assertive        # Options: chill, assertive. 'assertive' is better for auto-merge decisions.
  auto_review:
    enabled: true           # Automatically review every new PR.
    drafts: false           # Do not review PRs marked as Draft.
  
  # Crucial for Auto-Merge: This syncs AI approval as a GitHub Status Check
  review_status: true       
  
  # High-level summary of the PR
  summaries:
    enabled: true

  # RAG / Knowledge Base: Allows AI to understand the whole codebase, not just the diff
  knowledge_base:
    enabled: true

  tools:
    docstrings: false       # Disables automatic generation and committing of docstrings
    autofix: false          # Disables automatic code fix suggestions via commits
    
# Chat features allowed in PR comments
chat:
  enabled: true             # You can talk to AI in the comments to refine the PR.

# Custom Instructions to the AI
instructions: |
  - Focus on code logic, security vulnerabilities, and performance bottlenecks.
  - If the changes are minor or purely documentation/styling, and the CI passes, favor approving the PR.
  - For complex logic, be strict and ensure it doesn't break existing patterns found in the codebase.
  - CRITICAL: DO NOT perform any automated actions, such as committing code or creating new branches.
  - All suggestions must be provided strictly as comments for human review.

# (Optional) Skip specific files to save review noise
path_filters:
  - "!dist/**"
  - "!**/node_modules/**"
  - "!vendor/**"
  - "!*.lock"
