reviews:
  # Review tone / strictness
  profile: assertive

  # Automatic reviews on PRs
  auto_review:
    enabled: true
    drafts: false

  # Sync review result as GitHub Status Check (required for auto-merge)
  review_status: true

  # Provide a high-level summary for each PR
  high_level_summary: true

  # Finishing touches
  finishing_touches:
    docstrings:
      enabled: false

  # Static analysis integrations
  tools:
    ruff:
      enabled: true
    shellcheck:
      enabled: true

# Allow CodeRabbit to index the repository for better context
knowledge_base:
  opt_out: false

# Enable conversational replies in PR threads
chat:
  auto_reply: true
