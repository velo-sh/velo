[project]
name = "velo"
version = "0.1.0"
description = "Velo project Python tooling"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "blake3>=1.0.8",
    "fastapi>=0.128.0",
    "msgpack>=1.0",
    "psutil>=5.9",
    "pytest>=7.0",
    "requests>=2.28",
    "uvicorn>=0.40.0",
    "websocket-client>=1.8.0",
]

[tool.uv]
python-preference = "only-managed"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    # SPEC-0008: Tier Markers (SSOT for test discovery)
    "tier0: Smoke tests - basic sanity, <10s (SPEC-0008)",
    "tier1: Core logic tests - needs binary, <60s (SPEC-0008)",
    "tier2: E2E tests - full Zygote runtime, <10min (SPEC-0008)",
    "tier3: Hardened tests - stress/security, >10min (SPEC-0008)",
    "tier4: Chaos/Flood tests - hours (SPEC-0008)",
    "tier5: Extreme chaos - manual/pre-release only (SPEC-0008)",
    # Platform Markers
    "linux_only: Linux-specific features (Abstract Sockets, NUMA)",
    "macos_only: macOS-specific features (sandbox-exec)",
    "zygote_required: Requires Zygote mode (not fallback uvicorn)",
    # SPEC-0008: Specialized Categories
    "flood: High-concurrency flood tests (SPEC-0008 §3.1)",
    "chaos: Process killing/environment poisoning (SPEC-0008 §3.2)",
    "perf: Performance benchmarks - cold cache (SPEC-0008 §3.3)",
    "performance: Alias for perf marker",
    # pytest-asyncio integration
    "asyncio: Async tests requiring pytest-asyncio",
    # E2E and Correctness
    "e2e: End-to-end integration tests",
    "correctness: Correctness verification tests",
    # Legacy Markers (backward compatibility)
    "slow: marks tests as slow (deselect with '-m not slow')",
    "brutal: marks tests as brutal stress tests",
    "order: execution order for test hierarchy",
    "smoke: Tier 0 smoke tests",
    "security: Tier 1 security tests",
    "edge: Tier 2 edge case tests",
    "stability: Tier 2 stability tests",
    "desync: Tier 3 desynchronization tests",
    "release_blocker: Critical release blocker tests (MANDATORY)",
    "expert_review: Tests covering specific expert panel concerns",
    "integration: Tier 2 integration-level tests",
    "regression: Phase 6.2 regression probes",
    "heavy: Resource-intensive tests",
    "timeout: Tests with custom timeout requirements",
    "happy_path: Level 1 happy path journey tests",
    "cli: CLI-specific integration tests",
    "benchmark: Performance benchmark tests",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "types-psutil>=7.2.1.20251231",
    "types-requests>=2.32.4.20260107",
]

