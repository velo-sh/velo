[project]
name = "velo"
version = "0.1.0"
description = "Velo project Python tooling"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "blake3>=1.0.8",
    "msgpack>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "psutil>=5.9",
    "requests>=2.28",
]

[tool.uv]
python-preference = "only-managed"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m not slow')",
    "chaos: marks tests as resource-heavy chaos tests",
    "brutal: marks tests as brutal stress tests",
    "order: execution order for test hierarchy",
]
