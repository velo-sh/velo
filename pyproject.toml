[project]
name = "velo"
version = "0.1.0"
description = "Velo project Python tooling"
requires-python = "~=3.11.0"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "blake3>=1.0.8",
    "fastapi>=0.128.0",
    "msgpack>=1.0",
    "numpy>=2.4.1",
    "pandas>=3.0.0",
    "psutil>=5.9",
    "pytest>=7.0",
    "requests>=2.28",
    "torch>=2.10.0",
    "uvicorn>=0.40.0",
    "websocket-client>=1.8.0",
    "websockets>=12.0",
]

# RFC-0028: pytest-velo plugin registration
[project.entry-points."pytest11"]
velo = "pytest_velo.plugin"

[tool.uv]
python-preference = "only-managed"

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["pytest_velo", "velo", "velo_zygote"]


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    # SPEC-0008: Tier Markers (SSOT for test discovery)
    "tier0: Smoke tests - basic sanity, <10s (SPEC-0008)",
    "tier1: Core logic tests - needs binary, <60s (SPEC-0008)",
    "tier2: E2E tests - full Zygote runtime, <10min (SPEC-0008)",
    "tier3: Hardened tests - stress/security, >10min (SPEC-0008)",
    "tier4: Chaos/Flood tests - hours (SPEC-0008)",
    "tier5: Extreme chaos - manual/pre-release only (SPEC-0008)",
    # Platform Markers
    "linux_only: Linux-specific features (Abstract Sockets, NUMA)",
    "macos_only: macOS-specific features (sandbox-exec)",
    "zygote_required: Requires Zygote mode (not fallback uvicorn)",
    # SPEC-0008: Specialized Categories
    "flood: High-concurrency flood tests (SPEC-0008 §3.1)",
    "chaos: Process killing/environment poisoning (SPEC-0008 §3.2)",
    "perf: Performance benchmarks - cold cache (SPEC-0008 §3.3)",
    "performance: Alias for perf marker",
    # pytest-asyncio integration
    "asyncio: Async tests requiring pytest-asyncio",
    # E2E and Correctness
    "e2e: End-to-end integration tests",
    "correctness: Correctness verification tests",
    # Legacy Markers (backward compatibility)
    "slow: marks tests as slow (deselect with '-m not slow')",
    "brutal: marks tests as brutal stress tests",
    "order: execution order for test hierarchy",
    "smoke: Tier 0 smoke tests",
    "security: Tier 1 security tests",
    "edge: Tier 2 edge case tests",
    "stability: Tier 2 stability tests",
    "desync: Tier 3 desynchronization tests",
    "release_blocker: Critical release blocker tests (MANDATORY)",
    "expert_review: Tests covering specific expert panel concerns",
    "integration: Tier 2 integration-level tests",
    "regression: Phase 6.2 regression probes",
    "heavy: Resource-intensive tests",
    "shm: Shared memory or Linux-specific features (SPEC-0008)",
    "stress: High-pressure stress tests (SPEC-0008)",
    "sad_path: Negative test cases (error handling/failure modes)",
    "happy_path: Level 1 happy path journey tests",
    "tier2: Specialized edge and scale tests (Phase 6+)",
    "config: CLI and configuration related tests",
    "cli: CLI-specific integration tests",
    "security: Security and isolation tests (SPEC-0008)",
    "performance: Performance and timing verification",
    "vtest: Hybrid Velo/Pytest coordinator tests",
    "benchmark: Performance benchmark tests",
    "timeout: Tests with custom timeout requirements",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true
exclude = 'benchmarks/|examples/|ai-serverless-demo/|python/velo/_vendor/|scripts/|bench\.py|benchmark_.*\.py|run_tests\.py|vibe_demo\.py|python/jupyterhub_velo/|python/bundle_builder\.py|python/detect_app\.py|python/velo_loader\.py|slow\.py|fd_report_mod\.py|pytest_velo/'
explicit_package_bases = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

# Ruff: Fast Python linter (replaces flake8/isort/pyupgrade)
[tool.ruff]
target-version = "py311"
line-length = 120
exclude = ["velo_zygote/constants.py"]  # Generated file

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "B",      # bugbear
    "C4",     # comprehensions
    "UP",     # pyupgrade
    "PERF",   # performance anti-patterns
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function calls in defaults (FastAPI pattern)
    "PERF401",  # loop to comprehension - optional suggestion, not enforced
]

[tool.ruff.lint.isort]
known-first-party = ["velo_zygote"]

[tool.ruff.lint.per-file-ignores]
# E402: Tests legitimately require sys.path manipulation before imports
"tests/**/*.py" = ["E402"]
"python/pytest_velo/**/*.py" = ["E402"]
"velo_zygote/worker_launcher.py" = ["E402"]
"velo_zygote/main.py" = ["E402"]
# F401: conftest files import fixtures for other tests to use
"**/conftest.py" = ["F401"]
# F403/F405: Star imports from constants.py is SSOT pattern (constants are generated)
"velo_zygote/settings.py" = ["F403", "F405"]
"velo_zygote/paths.py" = ["F403", "F405"]

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=6.0.0",
    "types-psutil>=7.2.1.20251231",
    "types-requests>=2.32.4.20260107",
    "pre-commit>=4.0.0",
    "ruff>=0.9.0",
    "jsonschema>=4.23.0",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3.1",
    "pytest-shard>=0.1.2",  # For CI test sharding
    "pytest-json-report>=1.5.0",  # For CI false-positive detection
]


[tool.velo]
native_libraries = [".venv/lib/python*/site-packages/msgpack/_cmsgpack*"]
preload = ["json"]
