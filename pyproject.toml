[project]
name = "velo"
version = "0.1.0"
description = "Velo project Python tooling"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
dependencies = [
    "blake3>=1.0.8",
    "fastapi>=0.128.0",
    "msgpack>=1.0",
    "psutil>=5.9",
    "pytest>=7.0",
    "requests>=2.28",
    "uvicorn>=0.40.0",
]

[tool.uv]
python-preference = "only-managed"


[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
markers = [
    # RFC-0017: Tier Markers (SSOT for test discovery)
    "tier0: Unit tests - no external deps, <30s (RFC-0017)",
    "tier1: Integration tests - needs binary, <2min (RFC-0017)",
    "tier2: E2E tests - full Zygote runtime, <5min (RFC-0017)",
    "tier3: Hardened tests - security/stability (RFC-0017)",
    # RFC-0017: Platform Markers
    "linux_only: Linux-specific features (Abstract Sockets, NUMA)",
    "macos_only: macOS-specific features (sandbox-exec)",
    "zygote_required: Requires Zygote mode (not fallback uvicorn)",
    # Legacy Markers (backward compatibility)
    "slow: marks tests as slow (deselect with '-m not slow')",
    "chaos: marks tests as resource-heavy chaos tests",
    "brutal: marks tests as brutal stress tests",
    "order: execution order for test hierarchy",
    "smoke: Tier 0 smoke tests",
    "security: Tier 1 security tests",
    "edge: Tier 2 edge case tests",
    "stability: Tier 2 stability tests",
    "desync: Tier 3 desynchronization tests",
    "perf: Tier 3 performance tests",
    "release_blocker: Critical release blocker tests (MANDATORY)",
    "expert_review: Tests covering specific expert panel concerns",
    "integration: Tier 2 integration-level tests",
    "regression: Phase 6.2 regression probes",
    "tier4: Heavy chaos/stress tests",
    "heavy: Resource-intensive tests",
    "timeout: Tests with custom timeout requirements",
    "happy_path: Level 1 happy path journey tests",
    "cli: CLI-specific integration tests",
]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_return_any = true
warn_unused_ignores = false
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "types-psutil>=7.2.1.20251231",
    "types-requests>=2.32.4.20260107",
]

